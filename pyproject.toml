[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarecandyexporter"
version = "0.1.0"
description = "A small exporter utility for rare candy collections."
readme = "README.md"
authors = [
  { name = "Example Maintainer", email = "maintainer@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.urls]
"Source" = "https://github.com/your-org/RareCandyExporter"

[project.scripts]
rarecandyexporter = "rarecandyexporter.exporter:main"
